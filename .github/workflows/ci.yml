name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (web)
        run: npm run lint

      - name: Typecheck (api)
        run: npm -w @postforge/api run lint

      - name: Typecheck (mcp)
        run: npm -w @postforge/mcp run lint

      - name: Unit tests
        run: npm test

      - name: Build (web)
        run: npm run build

      - name: Build (api)
        run: npm -w @postforge/api run build

      - name: Build (mcp)
        run: npm -w @postforge/mcp run build
